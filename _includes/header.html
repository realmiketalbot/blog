<!-- Mirrors realmiketalbot.github.io/src/components/Header.astro -->
<header id="site-header" class="site-header">
  <nav class="site-nav" aria-label="Site">
    <a href="https://miketalbot.io/" class="site-wordmark">miketalbot<span>.io</span></a>
    <div class="site-nav-right">
      <ul class="site-sections">
        <li><a href="https://miketalbot.io/#about">About</a></li>
        <li><a href="https://miketalbot.io/#projects">Projects</a></li>
        <li><a href="https://miketalbot.io/#experience">Experience</a></li>
        <li><a href="https://miketalbot.io/#publications">Publications</a></li>
        <li><a href="https://miketalbot.io/#talks">Talks</a></li>
      </ul>
      <a href="https://miketalbot.io/cv" class="site-pill">CV</a>
      <a href="https://miketalbot.io/blog/" class="site-pill is-active" aria-current="page" data-site-root>Blog</a>
      <!-- quarto-color-scheme-toggle stops Quarto from floating its own toggle in the corner -->
      <button type="button" class="site-theme-toggle quarto-color-scheme-toggle" onclick="window.quartoToggleColorScheme()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg>
      </button>
    </div>
  </nav>
</header>
<script>
  (() => {
    // "Blog" points at this site's root, which differs between preview and production
    const offset = document.querySelector('meta[name="quarto:offset"]')?.content;
    if (offset) document.querySelector("[data-site-root]").href = offset;
    const header = document.getElementById("site-header");
    const onScroll = () => header.classList.toggle("is-scrolled", window.scrollY > 40);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
</script>
