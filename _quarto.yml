project:
  type: website
  output-dir: _site

website:
  title: "Mike Talbot"
  site-url: https://miketalbot.io/blog
  description: "Writing on hydrology, research computing, and science communication."

format:
  html:
    from: markdown+emoji
    theme:
      # Dark is listed first so it is the default, as on miketalbot.io
      dark: [cosmo, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    css: styles/site.css
    # The header and footer are copies of miketalbot.io's, in place of Quarto's navbar
    include-in-header:
      - _includes/theme-sync.html
      - _includes/analytics.html
    include-before-body: _includes/header.html
    include-after-body: _includes/footer.html
    title-block-banner: true
    toc: true
    code-copy: true
    highlight-style: a11y
    reference-location: margin
    smooth-scroll: true

execute:
  freeze: auto
